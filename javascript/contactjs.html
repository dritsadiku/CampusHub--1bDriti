
<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact the CampusHub team with your questions and suggestions.">
    <title>Contact - CampusHub</title>
    
</head>

<body>
    <header>
        <h1>CampusHub</h1>
        <p>Discover events, clubs and activities on campus.</p>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="clubs.html">Clubs</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Us</h2>

            <p>
                Have questions about CampusHub?
                Send us a message using the form below.
            </p>

            <form action="#" method="get" class="forma">
                <div>
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Write your full name..."
                        minlength="3"
                        maxlength="50"
                        autocomplete="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="jane@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="events">Events</option>
                        <option value="clubs">Clubs</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Write your message here..."
                        minlength="10"
                        rows="5"
                        required
                    ></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 CampusHub. All rights reserved.</p>
    </footer>
    <script src="week2extra.js" defer></script>
</body>

</html>
