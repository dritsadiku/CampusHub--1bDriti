<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
</head>
<body>
    <header>
        <h1>Events</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="eventet.html">Eventet</a>
            <a href="clubs.html">Clubs</a>
            <a href="#">About</a>
            <a href="contact.html">Contact</a>


        </nav>
    </header>
    <main class="container py-5">
        <section>
            <div class="text-center">
                 <h2 class="display-6 mb-3 fw-bold">Contact Us</h2>
                 <p class="text-secondary">Have any questions?<br>Send us a message.</p>
            </div>
           <div class="row justify-content-center">
               <div class="card h-100 shadow-sm border-0 col-12 col-md-10 col-lg-8">
                 <div class="card-body p-4">
<form action="">
                <div class="mb-3">
                    <label for="name">Emri dhe mbiemri:</label>
                    <input type="text" name="name" id="name" required minlength="3" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="email">Email</label>
                    <input class="form-control" type="email" name="email" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="subject">Subject</label>
                    <select name="subject" id="subject">
                        <option value="">Select a subject</option>
                        <option value="events">Events</option>
                        <option value="clubs">Clubs</option>
                        <option value="others">Others</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" required minlength="10" rows="3" class="form-control"></textarea>
                </div>
                <button class="btn btn-large btn-primary" type="submit">Send message</button>
            </form>
                 </div>
               </div>
           </div>
            
        </section>
        
    </main>
    <footer>
        <p>&copy; 2026 CampusHub</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
